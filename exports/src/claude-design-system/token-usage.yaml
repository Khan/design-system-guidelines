# --- Scales -------------------------------------------------------------------
sizing: "Spacing and sizing step; the number is px \u00d7 10. Use it for gaps, padding and fixed sizes."
border.radius: "Corner radius. `radius_080` (8px) on controls and cards; `radius_full` for circles and pills."
border.width: "Border width. `thin` by default, `medium` for emphasis, selection and errors, `thick` for rare accents."
boxShadow: "Elevation for raised surfaces (`low` cards, `mid` popovers and menus, `high` modals)."
font.heading.size: "Heading text, set with the WB `Heading` component or this size with its matching line height."
font.body.size: "Body and UI text, set with the WB `BodyText` component or this size with its matching line height."
