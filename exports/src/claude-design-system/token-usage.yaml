# Usage notes for tokens.json in the Claude "Wonder Blocks" Design System.
#
# Keys are token-path prefixes (the JS path, e.g. semanticColor.core.background).
# Each token gets the note of its longest matching prefix, and the generator
# appends its CSS variable. A token with no matching prefix fails `pnpm exports`,
# so a new Wonder Blocks token family needs a line here.
#
# Quote each note. Write where the token is used, in one or two sentences. The token's last
# segments (subtle/default/strong, hover/press, light/dark value) are visible in
# its name, so don't repeat them.

# --- Core: surfaces, text, borders ---------------------------------------------
semanticColor.core.transparent: "Fully transparent, for resetting a fill or border."
semanticColor.core.background.base: "Page and container surfaces. `default` is cards and main surfaces, `subtle` the page behind them, `strong` an inverted surface."
semanticColor.core.background.instructive: "The indigo brand and action color as a fill. `default` for one primary element per view; `subtle` for selected or highlighted rows and info tints."
semanticColor.core.background.neutral: "Neutral fills for chips, tracks, and inactive segments."
semanticColor.core.background.critical: "Fills for errors and destructive actions only, never decoration."
semanticColor.core.background.success: "Fills for success and completion states."
semanticColor.core.background.warning: "Fills for warnings and cautions."
semanticColor.core.background.disabled: "Fills for disabled controls."
semanticColor.core.background.overlay: "The scrim behind a modal."
semanticColor.core.foreground.neutral: "Text and icons. `strong` for body copy and headings on base and subtle surfaces (4.5:1 in both themes), `default` for secondary text, `subtle` for hints and placeholders."
semanticColor.core.foreground.instructive: "Indigo text and icons for links and progressive emphasis, on base surfaces."
semanticColor.core.foreground.critical: "Error text and icons, on base surfaces."
semanticColor.core.foreground.success: "Success text and icons, on base surfaces."
semanticColor.core.foreground.warning: "Warning text and icons, on base surfaces."
semanticColor.core.foreground.disabled: "Text and icons on disabled controls."
semanticColor.core.foreground.knockout: "Text and icons on a filled indigo or strong surface."
semanticColor.core.border.neutral: "Dividers and control outlines. `subtle` for card edges and rules, `strong` for control borders that must meet 3:1."
semanticColor.core.border.instructive: "Indigo borders for selected and focused-within states."
semanticColor.core.border.critical: "Borders on inputs and containers in an error state."
semanticColor.core.border.success: "Borders for success states."
semanticColor.core.border.warning: "Borders for warning states."
semanticColor.core.border.disabled: "Borders on disabled controls."
semanticColor.core.border.knockout: "Borders on a filled indigo or strong surface."
semanticColor.core.shadow.transparent: "The color inside the `shadow-*` elevation tokens. Use the shadow tokens, not this color, for elevation."
semanticColor.core.shadow.chonky: "The solid offset edge under \"chonky\" learner-facing buttons and cards."

# --- Feedback, status, focus, links --------------------------------------------
semanticColor.feedback.info: "Info banners and toasts (background, border, text, icon)."
semanticColor.feedback.success: "Success banners and toasts (background, border, text, icon)."
semanticColor.feedback.warning: "Warning banners and toasts (background, border, text, icon)."
semanticColor.feedback.critical: "Error banners and toasts (background, border, text, icon)."
semanticColor.feedback.neutral: "Neutral banners and toasts (background, border, text, icon)."
semanticColor.status: "Status badges and pills. Each status pairs a background with the foreground that reads on it; always add a label or icon."
semanticColor.focus.outer: "The outer ring of the focus indicator, shown on `:focus-visible` on every interactive element."
semanticColor.focus.inner: "The gap between the element and the outer focus ring."
semanticColor.link: "Inline link text in each interaction state."

# --- Actions and inputs (what the components paint) ----------------------------
semanticColor.action.primary: "Filled primary buttons (border, background, foreground per state). One per view. Use the WB Button, which applies these."
semanticColor.action.secondary: "Outlined secondary buttons (border, background, foreground per state). Use the WB Button."
semanticColor.action.tertiary: "Text-only tertiary buttons (border, background, foreground per state). Use the WB Button."
semanticColor.chonky: "Chonky learner-facing buttons and cards: fill, border, text and the solid offset edge per state."
semanticColor.input: "Text fields, selects, checkboxes and radios in each state. Use the WB form components, which apply these."

