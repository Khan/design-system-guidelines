<style>
  html { font-size: 62.5%; } /* WB tokens are rem on a 10px root, as on khanacademy.org. Without this everything is 1.6x too big. */
  html, body { margin: 0; background: var(--wb-semanticColor-core-background-base-subtle); color: var(--wb-semanticColor-core-foreground-neutral-strong); font-family: var(--wb-font-family-sans); }
  body { font-size: var(--wb-font-body-size-medium); line-height: var(--wb-font-body-lineHeight-medium); }
  #root { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

<body>
<div id="root"><p style="padding:16px">Loading Wonder Blocks…</p></div>
<script type="module">
// ---------- WB boot: copy verbatim ----------
const NPM = "https://cdn.jsdelivr.net/npm/";
const V = { tokens: "18.2.1", core: "12.5.0", button: "11.7.15", "icon-button": "12.0.4", icon: "6.0.5", typography: "5.0.8", layout: "4.0.0", card: "1.5.5", pill: "3.1.83", badge: "1.1.29", banner: "5.2.4", form: "7.7.9", switch: "3.4.17", dropdown: "11.0.4", modal: "8.10.7", popover: "7.1.6", tooltip: "4.2.18", toolbar: "5.1.67", tabs: "1.0.14", accordion: "3.2.4", breadcrumbs: "3.3.8", link: "10.5.5", "progress-spinner": "3.2.2", cell: "6.4.2", "search-field": "5.2.9", "date-picker": "1.2.7", "birthday-picker": "4.2.10", "labeled-field": "4.3.9", theming: "4.1.0" };
// wb("button") loads a package; destructuring a name it doesn't export throws a readable error instead of rendering nothing
const wb = (name) => import(`${NPM}@khanacademy/wonder-blocks-${name}@${V[name]}/+esm`).then((m) => new Proxy(m, { get(t, k) {
  if (typeof k === "string" && k !== "then" && !(k in t)) throw new Error(`wonder-blocks-${name} has no export "${k}". It exports: ${Object.keys(t).join(", ")}`);
  return t[k];
} }));
const svgUri = (d) => "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${d.width} ${d.height}">${d.body}</svg>`);
// icon("plus-bold") -> data-URI string usable anywhere WB wants a Phosphor icon (names: phosphoricons.com, weight suffix -bold / -fill, none for regular)
const icon = async (name) => svgUri((await import(`${NPM}@iconify-icons/ph@2.0.0/${name}/+esm`)).default);
const setTheme = (t) => { document.documentElement.setAttribute("data-wb-theme", t); document.documentElement.style.colorScheme = t === "syl-dark" ? "dark" : "light"; };
// A crash after load (in a click handler or a render) would otherwise blank the page silently; show it instead
addEventListener("error", (ev) => { const e = ev.error || ev.message; document.getElementById("root").innerHTML = '<pre id="wb-error"></pre>'; document.getElementById("wb-error").textContent = "Wonder Blocks page error:\n" + (e && e.stack || e); });
// Start in the viewer's light/dark preference: syl-dark is WB's dark theme, thunderblocks its light theme
const hostTheme = document.documentElement.getAttribute("data-theme");
const initialTheme = hostTheme === "dark" || (hostTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "syl-dark" : "thunderblocks";
try {
  setTheme(initialTheme);
  await import(`${NPM}@khanacademy/wonder-blocks-tokens@${V.tokens}/dist/css/index.css/+esm`); // injects the WB token CSS
  const { PhosphorIcon: BootPhosphorIcon } = await wb("icon"); // boot-only name: import PhosphorIcon yourself from section 2
  const imap = JSON.parse(document.querySelector('script[type="importmap"]').textContent).imports;
  await Promise.all(Object.values(imap).filter((u) => u.includes("@iconify-icons/ph@")).map((u) => import(u).then((m) => {
    const d = m.default, uri = svgUri(d); // WB's built-in icons: make them work as both string and element
    Object.setPrototypeOf(d, String.prototype);
    Object.assign(d, { toString: () => uri, valueOf: () => uri, $$typeof: Symbol.for("react.element"), type: BootPhosphorIcon, key: null, ref: null, props: { icon: uri }, _owner: null, _store: {} });
  })));
  const [React, { createRoot }, { default: htm }] = await Promise.all([import(`${NPM}react@18.2.0/+esm`), import(`${NPM}react-dom@18.2.0/client/+esm`), import(`${NPM}htm@3.1.1/+esm`)]);
  const html = htm.bind(React.createElement);
// ---------- end WB boot ----------
  // This card's app; everything above is the boot from the Claude artifact guide, verbatim.
  const [{ Heading, BodyText, BodyMonospace }, { default: IconButton, ActivityIconButton }] = await Promise.all([wb("typography"), wb("icon-button")]);
  const [downloadIcon] = await Promise.all([icon("download-simple-bold")]);
  const dupes = performance.getEntriesByType("resource").map((e) => e.name).filter((n) => /\/npm\/react(-dom)?@(?!18\.2\.0\/)/.test(n));
  if (dupes.length) throw new Error("A second React copy loaded. Add a prefix mapping to react@18.2.0 in the import map for:\n" + dupes.join("\n"));
  // From __docs__/design-components/assets/distribution-charts/AssignmentsCompletedChart.tsx, read at build time.
  const EMPHASIS = {"fill":"#8DA2FF","outline":"#6C82FF"};
  const COMPARISON = {"fill":"#DFEAFF","outline":"#6C82FF"};
  // The design system page sets data-theme="light" | "dark" on <html>; follow it with the matching WB theme.
  new MutationObserver(() => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "syl-dark" : "thunderblocks"))
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  function App() {
    const subtle = { color: "var(--wb-semanticColor-core-foreground-neutral-subtle)" };
    const box = { background: "var(--wb-semanticColor-core-background-base-default)", border: "var(--wb-border-width-thin) solid var(--wb-semanticColor-core-border-neutral-subtle)", borderRadius: "var(--wb-border-radius-radius_120)", padding: "var(--wb-sizing-size_200)", display: "flex", flexDirection: "column", gap: "var(--wb-sizing-size_160)" };
    const data = [["none", 2, false], ["1–2", 3, false], ["3–4", 5, false], ["5–6", 40, true], ["7–8", 34, true], ["9–10", 5, false], ["11+", 3, false]];
    const [L, R, T, B, MAX] = [56, 630, 24, 220, 50];
    const y = (v) => B - (v / MAX) * (B - T);
    const band = (R - L) / data.length, w = band * 0.62;
    return html`
      <div className="stack" style=${{ maxWidth: 680 }}>
        <${Heading} size="medium" tag="h2">Assignments completed</${Heading}>
        <div style=${box}>
          <div className="row" style=${{ justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <${Heading} size="small" tag="h3">Most students completed five to eight assignments</${Heading}>
              <${BodyText} size="small" style=${subtle}>74 of 92 students</${BodyText}>
            </div>
            <${IconButton} icon=${downloadIcon} kind="secondary" actionType="neutral" aria-label="Download assignments completed data" />
          </div>
          <svg viewBox="0 0 640 270" width="100%" role="group" aria-label="Bar chart of students by number of assignments completed">
            ${[0, 10, 20, 30, 40, 50].map((t) => html`<g key=${t}>
              <line x1=${L} x2=${R} y1=${y(t)} y2=${y(t)} style=${{ stroke: t === 0 ? "var(--wb-semanticColor-core-border-neutral-default)" : "var(--wb-semanticColor-core-border-neutral-subtle)" }} strokeDasharray=${t === 0 ? undefined : "3 3"} />
              <text x=${L - 10} y=${y(t) + 4} textAnchor="end" fontSize="12" style=${{ fill: "var(--wb-semanticColor-core-foreground-neutral-subtle)" }}>${t}</text></g>`)}
            <text x="14" y=${(T + B) / 2} transform=${`rotate(-90 14 ${(T + B) / 2})`} textAnchor="middle" fontSize="12" style=${{ fill: "var(--wb-semanticColor-core-foreground-neutral-subtle)" }}>Students</text>
            ${data.map(([label, n, em], i) => {
              const x = L + i * band + (band - w) / 2, top = y(n), r = Math.min(4, (B - top) / 2), c = em ? EMPHASIS : COMPARISON;
              return html`<g key=${label} tabIndex="0" role="img" aria-label=${`${label === "none" ? "No" : label} assignments: ${n} students`}>
                <path d=${`M${x},${B} V${top + r} Q${x},${top} ${x + r},${top} H${x + w - r} Q${x + w},${top} ${x + w},${top + r} V${B} Z`} fill=${c.fill} stroke=${c.outline} strokeWidth="1" />
                <text x=${x + w / 2} y=${top - 8} textAnchor="middle" fontSize="13" fontWeight=${em ? 600 : 400} style=${{ fill: "var(--wb-semanticColor-core-foreground-neutral-default)" }}>${n}</text>
                <text x=${x + w / 2} y=${B + 20} textAnchor="middle" fontSize="12" style=${{ fill: "var(--wb-semanticColor-core-foreground-neutral-subtle)" }}>${label}</text></g>`;
            })}
            <text x=${(L + R) / 2} y=${B + 44} textAnchor="middle" fontSize="12" style=${{ fill: "var(--wb-semanticColor-core-foreground-neutral-subtle)" }}>Assignments completed</text>
          </svg>
          <${BodyText} size="small" style=${{ ...subtle, borderTop: "var(--wb-border-width-thin) solid var(--wb-semanticColor-core-border-neutral-subtle)", paddingTop: "var(--wb-sizing-size_120)" }}>Updated Oct 20, 2026, 9:15 AM</${BodyText}>
        </div>
      </div>
    `;
  }
  createRoot(document.getElementById("root")).render(html`<${App} />`);
} catch (e) {
  document.getElementById("root").innerHTML = '<pre id="wb-error"></pre>';
  document.getElementById("wb-error").textContent = "Wonder Blocks failed to load:\n" + (e && e.stack || e);
}
</script>
</body>
