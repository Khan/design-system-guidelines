# PR status check: the Storybook must compile (one unclosed JSX tag in any
# MDX file breaks the whole site, so this gates merges even though the
# Chromatic workflow also builds), and the generated design-md/published/ files must
# match their templates and the installed tokens.
name: Build check

on:
    pull_request:

jobs:
    build:
        # This name is what branch rulesets list as the required check.
        name: Build check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v5

            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - run: pnpm install --frozen-lockfile

            - run: pnpm typecheck

            - run: pnpm test

            # Also regenerates design-md/published/ from design-md/src/ and the
            # installed wonder-blocks-tokens.
            - run: pnpm build

            - name: design-md is up to date
              run: |
                  if [ -n "$(git status --porcelain -- design-md/published/)" ]; then
                    git status --porcelain -- design-md/published/
                    echo "::error::design-md/published/ is stale or hand-edited. Run 'pnpm install && pnpm design-md' and commit the result."
                    exit 1
                  fi

            - run: pnpm lint:design-md
